services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_os
    ports:
      - '5432:5432'
    volumes:
      - financial_os_pgdata:/var/lib/postgresql/data

volumes:
  financial_os_pgdata:
