services:
  postgres:
    image: postgres:16-alpine
    container_name: bizledger-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bizledger
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bizledger']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bizledger_pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  bizledger_pgdata:
