<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0B6E4F"/>
  <circle cx="1010" cy="120" r="300" fill="#084C37" opacity="0.55"/>
  <circle cx="40" cy="1230" r="260" fill="#084C37" opacity="0.45"/>
  
  <text x="72" y="150" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="40" fill="#F5B800" letter-spacing="3">WHY I’M BUILDING BIZLEDGER</text>
  <text font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="76">
    <tspan x="72" y="330" fill="#FFF">Many shops run</tspan>
    <tspan x="72" y="425" fill="#FFF">on notebooks and</tspan>
    <tspan x="72" y="520" fill="#F5B800">memory.</tspan>
  </text>
  <text x="72" y="650" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-weight="400" font-size="46" fill="#FFFFFF" opacity="0.95">I’m a mechatronics engineer in Owo.</text>
  <text x="72" y="715" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-weight="400" font-size="46" fill="#FFFFFF" opacity="0.95">I’m trained to think in systems.</text>
  <text x="72" y="780" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-weight="400" font-size="46" fill="#FFFFFF" opacity="0.95">So I’m building one for traders.</text>
  <rect x="72" y="850" width="936" height="6" rx="3" fill="#F5B800" opacity="0.8"/>
  <text x="72" y="950" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="52" fill="#FFFFFF" >Sales. Stock. Expenses. Debts.</text>
  <text x="72" y="1020" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="44" fill="#F5B800" >One simple app. Built in Nigeria.</text>
  
  <g transform="translate(72 1128) scale(0.1)">
